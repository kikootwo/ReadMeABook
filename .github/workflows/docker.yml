name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - add-ebook-providers

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: deadpoolkb/readmeabook

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile.unified
          push: true
          tags: |
            ghcr.io/deadpoolkb/readmeabook:latest
            ghcr.io/deadpoolkb/readmeabook:${{ github.sha }}
