[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
loglevel=info
pidfile=/var/run/supervisord.pid

[program:postgresql]
command=/app/postgres-start.sh
user=postgres
autostart=true
autorestart=true
priority=10
; SIGINT = PostgreSQL fast shutdown: ends open sessions, writes a checkpoint, exits.
; The default SIGTERM is smart shutdown, which waits for every client and is SIGKILLed at 10 s.
; Keep the container stop grace period above the sum of every program's stopwaitsecs.
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_events_enabled=true
stderr_events_enabled=true

[program:redis]
command=/app/redis-start.sh
user=root
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_events_enabled=true
stderr_events_enabled=true

[program:app]
command=/app/app-start.sh
directory=/app
user=root
autostart=true
autorestart=true
priority=30
environment=NODE_ENV="production",PORT="3030",HOSTNAME="0.0.0.0"
; app-start.sh forwards SIGTERM to node, which drains jobs and exits within 5 s
; (src/lib/constants/shutdown.ts). At stopwaitsecs the whole group is SIGKILLed: wrapper, node, ffmpeg.
; No stopasgroup: it would SIGTERM a running ffmpeg at once and fail the import it belongs to.
stopwaitsecs=10
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_events_enabled=true
stderr_events_enabled=true
