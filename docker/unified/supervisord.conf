[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
loglevel=info
pidfile=/var/run/supervisord.pid

[program:postgresql]
command=/app/postgres-start.sh
user=postgres
autostart=true
autorestart=true
priority=10
; SIGINT = PostgreSQL "fast" shutdown: closes client sessions, checkpoints, exits clean.
; The default SIGTERM ("smart") waits for every client to disconnect and is SIGKILLed
; after supervisord's default 10s, forcing WAL crash recovery on every start.
; Keep the container's stop_grace_period above the sum of all stopwaitsecs.
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_events_enabled=true
stderr_events_enabled=true

[program:redis]
command=/app/redis-start.sh
user=root
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_events_enabled=true
stderr_events_enabled=true

[program:app]
command=/app/app-start.sh
directory=/app
user=root
autostart=true
autorestart=true
priority=30
environment=NODE_ENV="production",PORT="3030",HOSTNAME="0.0.0.0"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_events_enabled=true
stderr_events_enabled=true
